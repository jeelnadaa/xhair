[package]
name = "xhair-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri shell, system tray, runtime modes, and app wiring for xhair"

[[bin]]
name = "xhair"
path = "src/main.rs"

[dependencies]
xhair-model = { path = "../xhair-model" }
xhair-geometry = { path = "../xhair-geometry" }
xhair-commands = { path = "../xhair-commands" }
xhair-render = { path = "../xhair-render" }
xhair-platform-win = { path = "../xhair-platform-win" }
xhair-mcp = { path = "../xhair-mcp" }
xhair-library = { path = "../xhair-library" }
wry = { version = "0.56", features = ["devtools"] }
tao = "0.36"
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true
uuid.workspace = true
rust-embed = "8.13.0"

[dev-dependencies]
tempfile.workspace = true
