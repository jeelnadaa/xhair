[package]
name = "xhair-platform-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Windows Win32 layered overlay window, monitor enumeration, and hotkeys for xhair"

[dependencies]
xhair-model = { path = "../xhair-model" }
xhair-geometry = { path = "../xhair-geometry" }
xhair-render = { path = "../xhair-render" }
tiny-skia.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
]

