name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Lint & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace Tests
        run: cargo test --workspace
      - name: Verify Agent Continuity State
        run: cargo run --package xtask -- check-agent-state
      - name: Verify Property Schema Drift
        run: cargo run --package xtask -- schema --check
      - name: Query Memory Graph
        run: cargo run --package xtask -- graph query --summary

  ui:
    name: UI Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Test
        run: pnpm -C ui test
      - name: Lint
        run: pnpm -C ui lint
