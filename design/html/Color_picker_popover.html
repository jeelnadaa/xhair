<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Picker Popover — XHAIR Design v2</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090A0D;
  --s1: #111418;
  --s2: #181C22;
  --s3: #21262F;
  --ln: #282F3A;
  --ln-subtle: #1C222B;
  --ln-active: #404A59;
  --tx: #E5E7EB;
  --mu: #8E98A8;
  --dim: #545E6E;
  --ac: #38BDF8;
  --ac-dim: #0C2836;
  --center-guide: #FF4FD8;
  --warning: #F59E0B;
  --warning-bg: #261B07;
  --danger: #EF4444;
  --danger-bg: #2B1111;
  --success: #10B981;
  --success-bg: #0A261C;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
.m { font-family: 'JetBrains Mono', Consolas, monospace; }
.app-shell {
  width: 1440px; height: 900px;
  display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg);
  position: relative;
}
.top-bar {
  height: 52px; flex: none;
  background: var(--s1);
  border-bottom: 1px solid var(--ln);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
}
.brand {
  font-weight: 900; letter-spacing: 0.14em;
  color: var(--tx); font-size: 14px;
}
.sep { color: var(--dim); margin: 0 4px; }
.btn {
  background: var(--s2);
  border: 1px solid var(--ln);
  border-radius: 6px;
  padding: 0 12px; height: 32px;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--tx); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.15s ease;
}
.btn:hover { background: var(--s3); border-color: var(--ln-active); }
.btn-sm { height: 26px; padding: 0 8px; font-size: 11px; }
.btn-primary { background: var(--tx); color: #000; border-color: var(--tx); font-weight: 700; }
.btn-primary:hover { background: #fff; border-color: #fff; }
.btn-accent { background: var(--ac); color: #04110E; border-color: var(--ac); font-weight: 700; }
.pill {
  border: 1px solid var(--ln);
  border-radius: 99px;
  padding: 4px 10px; font-size: 11px; color: var(--mu);
  background: var(--s2);
  display: inline-flex; align-items: center; gap: 6px;
}
.pill.active { color: var(--tx); border-color: var(--ln-active); }
.dot-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.dot-indicator.on { background: var(--tx); box-shadow: 0 0 6px rgba(255,255,255,0.4); }
.input {
  background: var(--bg);
  border: 1px solid var(--ln);
  border-radius: 6px; height: 32px;
  padding: 0 10px; color: var(--tx);
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
}
.input:focus { outline: none; border-color: var(--ln-active); }
.panel {
  background: var(--s1);
  border: 1px solid var(--ln);
  border-radius: 8px; padding: 14px; margin-bottom: 12px;
}
.panel-h {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--mu); font-weight: 700; margin: 0 0 12px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.badge {
  font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
  background: var(--s3); color: var(--mu);
}
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-offset { background: #261D09; color: #FBBF24; border: 1px solid #78350F; }
.badge-shortcut { background: var(--s3); border: 1px solid var(--ln); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--mu); padding: 1px 5px; border-radius: 3px; }
.row-flex { display: flex; align-items: center; justify-content: space-between; }
.track { height: 4px; background: var(--ln); border-radius: 2px; margin-top: 6px; position: relative; }
.track-fill { height: 4px; background: var(--tx); border-radius: 2px; }
.modal-overlay {
  position: absolute; inset: 0;
  background: rgba(4, 5, 8, 0.78);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-window {
  background: var(--s1);
  border: 1px solid var(--ln-active);
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.85);
  overflow: hidden;
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="top-bar" style="filter:blur(2px) brightness(0.4);"><span class="brand">XHAIR</span><span class="sep">/</span><span>Editor</span></header>
  <div style="flex:1; background:#080A0D; filter:blur(2px) brightness(0.4);"></div>
  <div class="modal-overlay">
    <div class="modal-window" style="width:360px; padding:18px; display:flex; flex-direction:column; gap:14px;">
      <div class="panel-h" style="margin:0;">
        <span>Color & Gradient Picker (§7)</span>
        <button class="btn btn-sm" style="width:24px; height:24px; padding:0;">×</button>
      </div>
      <div style="width:100%; height:180px; border-radius:8px; border:1px solid var(--ln); position:relative; overflow:hidden; cursor:crosshair; background:linear-gradient(to top, #000, transparent), linear-gradient(to right, #FFF, #00E5FF);">
        <div style="position:absolute; left:75%; top:25%; width:14px; height:14px; border-radius:50%; border:2px solid #FFF; box-shadow:0 0 4px #000; transform:translate(-50%, -50%);"></div>
      </div>
      <div>
        <label style="font-size:11px; color:var(--mu); display:block; margin-bottom:4px;">Hue</label>
        <div style="height:12px; border-radius:6px; border:1px solid var(--ln); background:linear-gradient(to right, #F00, #FF0, #0F0, #0FF, #00F, #F0F, #F00); position:relative;">
          <div style="position:absolute; left:48%; top:50%; width:14px; height:14px; border-radius:50%; background:#FFF; border:2px solid #000; transform:translate(-50%, -50%);"></div>
        </div>
      </div>
      <div>
        <label style="font-size:11px; color:var(--mu); display:block; margin-bottom:4px;">Alpha (Opacity 100%)</label>
        <div style="height:12px; border-radius:6px; border:1px solid var(--ln); background:linear-gradient(to right, transparent, #38BDF8), repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 8px 8px; position:relative;">
          <div style="position:absolute; right:0; top:50%; width:14px; height:14px; border-radius:50%; background:#FFF; border:2px solid #000; transform:translate(50%, -50%);"></div>
        </div>
      </div>
      <div style="display:grid; grid-template-columns: 1.2fr 1fr 1fr; gap:6px;">
        <div>
          <label style="font-size:10px; color:var(--mu); display:block;">Hex Color</label>
          <input class="input m" value="#38BDF8FF" style="width:100%; height:26px; padding:0 6px; font-size:11px;">
        </div>
        <div>
          <label style="font-size:10px; color:var(--mu); display:block;">RGB</label>
          <input class="input m" value="56,189,248" style="width:100%; height:26px; padding:0 6px; font-size:10px;">
        </div>
        <div>
          <label style="font-size:10px; color:var(--mu); display:block;">HSV</label>
          <input class="input m" value="199,77,97" style="width:100%; height:26px; padding:0 6px; font-size:10px;">
        </div>
      </div>
      <div>
        <div style="font-size:11px; color:var(--mu); margin-bottom:6px; display:flex; justify-content:space-between;">
          <span>Custom Swatches</span>
          <span style="color:var(--ac); cursor:pointer;">+ Add Current</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <div style="width:20px; height:20px; border-radius:4px; background:#38BDF8; border:1px solid #FFF;"></div>
          <div style="width:20px; height:20px; border-radius:4px; background:#10B981; border:1px solid var(--ln);"></div>
          <div style="width:20px; height:20px; border-radius:4px; background:#F59E0B; border:1px solid var(--ln);"></div>
          <div style="width:20px; height:20px; border-radius:4px; background:#EF4444; border:1px solid var(--ln);"></div>
          <div style="width:20px; height:20px; border-radius:4px; background:#FF4FD8; border:1px solid var(--ln);"></div>
          <div style="width:20px; height:20px; border-radius:4px; background:#FFFFFF; border:1px solid var(--ln);"></div>
        </div>
      </div>
      <div style="background:var(--s2); border:1px solid var(--ln); border-radius:6px; padding:8px;">
        <span style="font-size:10px; font-weight:700; color:var(--mu); display:block; margin-bottom:4px;">Colorblind-Safe Palettes</span>
        <div style="display:flex; gap:4px;">
          <button class="btn btn-sm" style="font-size:10px; flex:1;">Deuteranopia</button>
          <button class="btn btn-sm" style="font-size:10px; flex:1;">Protanopia</button>
          <button class="btn btn-sm" style="font-size:10px; flex:1;">Tritanopia</button>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
        <button class="btn btn-sm">Canvas Eyedropper</button>
        <button class="btn btn-sm btn-primary" style="padding:0 16px;">Apply Paint</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
